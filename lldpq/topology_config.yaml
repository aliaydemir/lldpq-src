# =============================================================================
# TOPOLOGY_CONFIG.YAML - LLDPq Expected Network Topology Definition
# =============================================================================
#
# Topology Generation Mode:
# - minimal: Uses generate_topology.py (faster, basic topology)
# - full: Uses generate_topology_full.py (comprehensive, detailed topology)
# This setting determines which script lldp-validate.py will automatically call
# If you want to use the full topology, the topology will also be displayed for devices discovered with LLDP.

topology: minimal  # [full] or [minimal]

# Topology Device Configuration
# This file defines device categorization for topology generation
# Edit this file to customize device layers and icons
#
# Pattern matching supports REGEX:
#
#   - "spine"           matches any device containing "spine"
#   - "^spine-"         matches devices starting with "spine-"
#   - "leaf-[0-9]+$"    matches devices ending with "leaf-" + numbers
#   - "border|edge"     matches devices containing "border" OR "edge"
#   - "^dc[12]-spine"   matches dc1-spine-01, dc2-spine-02, etc.
#
# The first matching pattern wins, so list the more specific name before the
# more general one it contains ("sspine" before "spine").
#
# Layer: lower number = higher in the diagram (super-spine top, ToR bottom).
# Gaps between layer numbers leave room to insert a tier without renumbering.
#
# Possible icons:
#
# - switch    🔀
# - router    🌐
# - firewall  🔥 [EndPoint]
# - server    🖥️ [EndPoint]
# - host      💻 [EndPoint]
# - unknown   ❓ [EndPoint]

device_categories:

  # Super-spines (top tier)
  - pattern: "sspine"
    layer: 1
    icon: "switch"

  # Spines
  - pattern: "spine"
    layer: 3
    icon: "switch"

  # Border leaves (fabric edge)
  - pattern: "border"
    layer: 5
    icon: "router"

  # Leaves
  - pattern: "leaf"
    layer: 7
    icon: "switch"

  # Out-of-band top-of-rack (access tier)
  - pattern: "oob-tor"
    layer: 9
    icon: "switch"

  # Firewalls discovered via LLDP
  - pattern: "fw"
    layer: 11
    icon: "firewall"

# Default category for unmatched devices (servers / BMC / endpoints)
default:
  layer: 29
  icon: "host"

# Special conditional rules for devices with complex logic.
#
# These are evaluated BEFORE device_categories, and the pattern is a substring
# regex matched case-insensitively, so a short pattern catches far more than it
# appears to. Keep them commented out unless a site actually needs one.

# =============================================================================
# devices.yaml - LLDPq Network Device Configuration
# =============================================================================
#
# PURPOSE:
#   Central device list for LLDPq tooling (pping, zzh, send-cmd, get-conf) and
#   topology validation. Hostnames must match topology.dot; management IPs must
#   match the ones the Ansible inventory configures.
#
# FORMAT:
#   IP: Hostname                    # simple
#   IP: Hostname @role              # with role (for filtering)
#   IP:                             # extended format
#     hostname: Hostname
#     username: custom_user
#     role: role_name
#
# ROLES (keep them equal to the Ansible inventory group names):
#   zzh                   -> type "@compute_leaf" to filter
#   pping -r oob_tor      -> ping only @oob_tor devices
#   send-cmd -r tan_spine -> run only on @tan_spine devices
#   --roles               -> list all available roles
#
# SSH REQUIREMENTS:
#   - SSH key auth configured (use send-keys.sh)
#   - Sudo privileges on devices (use sudo-fix.sh)
#
# SAMPLE FABRIC:
#   The devices below describe a three-fabric reference lab. Only switches are
#   listed: servers and firewalls are reached through endpoint_hosts instead,
#   because LLDPq collects with switch commands. Replace them with the real
#   inventory.
# =============================================================================

defaults:
  username: cumulus

devices:

  # ---- EAST-WEST (Compute) fabric - SN5600 ----
  192.168.200.101: ew-sspine-01 @compute_super_spine
  192.168.200.102: ew-sspine-02 @compute_super_spine
  192.168.200.111: ew-spine-01 @compute_spine
  192.168.200.112: ew-spine-02 @compute_spine
  192.168.200.121: ew-leaf-01 @compute_leaf
  192.168.200.122: ew-leaf-02 @compute_leaf
  192.168.200.123: ew-leaf-03 @compute_leaf
  192.168.200.124: ew-leaf-04 @compute_leaf

  # ---- NORTH-SOUTH (Converged) fabric - SN5600 / SN4700 ----
  192.168.200.131: ns-sspine-01 @tan_super_spine
  192.168.200.132: ns-sspine-02 @tan_super_spine
  192.168.200.141: ns-spine-01 @tan_spine
  192.168.200.142: ns-spine-02 @tan_spine
  192.168.200.151: ns-leaf-01 @tan_leaf
  192.168.200.152: ns-leaf-02 @tan_leaf
  192.168.200.161: border-01 @border_leaf
  192.168.200.162: border-02 @border_leaf

  # ---- OUT-OF-BAND (OOB) fabric - SN5600 / SN2201 ----
  192.168.200.171: oobm-spine-01 @oob_spine
  192.168.200.172: oobm-spine-02 @oob_spine
  192.168.200.181: oobm-leaf-01 @oob_leaf
  192.168.200.182: oobm-leaf-02 @oob_leaf
  192.168.200.191: oobm-tor-01 @oob_tor
  192.168.200.192: oobm-tor-02 @oob_tor
  192.168.200.193: oobm-tor-03 @oob_tor
  192.168.200.194: oobm-tor-04 @oob_tor

# =============================================================================
# ENDPOINT HOSTS - extra hostnames/patterns for topology visualization
# =============================================================================
#
# Devices that appear in topology.dot but are not monitored above. A designed
# link is only checked when both of its endpoints are known, so anything named
# here becomes eligible for validation.
#
# An exact name is added to the topology whether or not LLDP reports it, while
# a pattern only matches devices that LLDP actually discovered as neighbours.
# Prefer exact names for hosts that may not run lldpd, such as servers.
#
# PATTERN EXAMPLES:
#   - "*dgx*"      -> all devices containing "dgx"
#   - "leaf-*"     -> all devices starting with "leaf-"
#   - "*-gpu"      -> all devices ending with "-gpu"
#
# Patterns anchor at both ends, so "*-fw" matches a host named exactly
# "site-fw" but not "external-fw-01".
# =============================================================================

endpoint_hosts:
  # Compute servers: listed exactly, since they may not advertise LLDP
  - gpu-srv-01
  - gpu-srv-02
  - gpu-srv-03
  - gpu-srv-04

  # Firewalls, discovered through the LLDP neighbours of the border leaves
  - "*fw*"

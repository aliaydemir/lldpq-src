# =============================================================================
# devices.yaml - LLDPq Network Device Configuration (cl-auto-17)
# =============================================================================
#
# PURPOSE:
#   Central device list for LLDPq tooling (pping, zzh, send-cmd, get-conf) and
#   topology validation. Management IPs match inventory host_vars (192.168.200.0/24)
#   and the AIR topology (topology.dot).
#
# FORMAT:
#   IP: Hostname                    # simple
#   IP: Hostname @role              # with role (for filtering)
#   IP:                             # extended format
#     hostname: Hostname
#     username: custom_user
#     role: role_name
#
# ROLES (match inventory.ini groups):
#   zzh               -> type "@compute_leaf" to filter
#   pping -r oob_tor  -> ping only @oob_tor devices
#   send-cmd -r tan_spine -> run only on @tan_spine devices
#   --roles           -> list all available roles
# =============================================================================

defaults:
  username: cumulus

devices:


  # ---- EAST-WEST (Compute) fabric, plane 1 - SN5600 ----
  192.168.200.101: ew-p1-spine-01 @compute_p1_spine
  192.168.200.102: ew-p1-spine-02 @compute_p1_spine
  192.168.200.103: ew-p1-spine-03 @compute_p1_spine
  192.168.200.104: ew-p1-spine-04 @compute_p1_spine
  192.168.200.105: ew-p1-leaf-01 @compute_p1_leaf
  192.168.200.106: ew-p1-leaf-02 @compute_p1_leaf
  192.168.200.107: ew-p1-leaf-03 @compute_p1_leaf
  192.168.200.108: ew-p1-leaf-04 @compute_p1_leaf
  192.168.200.109: ew-p1-leaf-05 @compute_p1_leaf
  192.168.200.110: ew-p1-leaf-06 @compute_p1_leaf
  192.168.200.111: ew-p1-leaf-07 @compute_p1_leaf
  192.168.200.112: ew-p1-leaf-08 @compute_p1_leaf

  # ---- EAST-WEST (Compute) fabric, plane 2 - SN5600 ----
  192.168.200.113: ew-p2-spine-01 @compute_p2_spine
  192.168.200.114: ew-p2-spine-02 @compute_p2_spine
  192.168.200.115: ew-p2-spine-03 @compute_p2_spine
  192.168.200.116: ew-p2-spine-04 @compute_p2_spine
  192.168.200.117: ew-p2-leaf-01 @compute_p2_leaf
  192.168.200.118: ew-p2-leaf-02 @compute_p2_leaf
  192.168.200.119: ew-p2-leaf-03 @compute_p2_leaf
  192.168.200.120: ew-p2-leaf-04 @compute_p2_leaf
  192.168.200.121: ew-p2-leaf-05 @compute_p2_leaf
  192.168.200.122: ew-p2-leaf-06 @compute_p2_leaf
  192.168.200.123: ew-p2-leaf-07 @compute_p2_leaf
  192.168.200.124: ew-p2-leaf-08 @compute_p2_leaf

  # ---- NORTH-SOUTH (Converged) fabric - SN5600 ----
  192.168.200.131: ns-sspine-01 @tan_super_spine
  192.168.200.132: ns-sspine-02 @tan_super_spine
  192.168.200.133: ns-sspine-03 @tan_super_spine
  192.168.200.141: ns-spine-01 @tan_spine
  192.168.200.142: ns-spine-02 @tan_spine
  192.168.200.143: ns-spine-03 @tan_spine
  192.168.200.144: ns-spine-04 @tan_spine
  192.168.200.151: ns-leaf-01 @tan_leaf
  192.168.200.152: ns-leaf-02 @tan_leaf
  192.168.200.153: ns-leaf-03 @tan_leaf
  192.168.200.154: ns-leaf-04 @tan_leaf
  192.168.200.155: ns-leaf-05 @tan_leaf
  192.168.200.156: ns-leaf-06 @tan_leaf
  192.168.200.157: ns-leaf-07 @tan_leaf
  192.168.200.158: ns-leaf-08 @tan_leaf
  192.168.200.161: border-01 @border_leaf
  192.168.200.162: border-02 @border_leaf

  # ---- OUT-OF-BAND (OOB) fabric - SN5600 / SN2201 ----
  192.168.200.171: oobm-spine-01 @oob_spine
  192.168.200.172: oobm-spine-02 @oob_spine
  192.168.200.181: oobm-leaf-01 @oob_leaf
  192.168.200.182: oobm-leaf-02 @oob_leaf
  192.168.200.191: oobm-tor-01 @oob_tor
  192.168.200.192: oobm-tor-02 @oob_tor
  192.168.200.193: oobm-tor-03 @oob_tor
  192.168.200.194: oobm-tor-04 @oob_tor

# =============================================================================
# ENDPOINT HOSTS - extra hostnames/patterns for topology visualization
# =============================================================================
# The firewalls stay out of the managed list on purpose: they are external
# devices we do not own. They appear here only so LLDPq draws them as endpoints.
endpoint_hosts:
  - "gpu-srv-*"         # GPU servers on the EW rails
  - "cpu-srv-*"         # CPU servers on the NS leaf pairs
  - "external-fw-*"     # firewalls discovered via LLDP

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>..::LLDPQ:: BMC</title>
    <link rel="shortcut icon" href="/png/favicon.ico">
    <script src="/css/auth.js"></script>
    <link rel="stylesheet" href="/css/select2.min.css">
    <link rel="stylesheet" href="/css/table-filter.css?v=20261021-tf-4">
    <link rel="stylesheet" href="/css/bmc.css?v=20261021-2">
    <link rel="stylesheet" href="/css/bmc-results.css?v=20261021-2">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="bmc-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">BMC</h1>
            <div class="last-updated"><span id="bmc-updated">Loading observations…</span><button id="bmc-refresh" class="bmc-refresh-link" type="button" title="Refresh the latest collected observations" aria-label="Refresh BMC observations">↻</button></div>
        </div>
        <div class="action-buttons">
            <div class="device-search-container">
                <select id="deviceSearch" multiple aria-label="Filter by device or host" style="min-width:220px;"></select>
                <button id="clearSearchBtn" class="clear-search-btn" type="button" aria-label="Clear selected devices" hidden>✕</button>
            </div>
            <button class="btn btn-secondary" id="bmc-run" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg><span id="bmc-run-text">Run BMC Check</span></button>
            <button class="btn btn-gray" id="bmc-edit" type="button" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg>Edit Mappings</button>
            <button class="btn btn-gray" id="p2p-toggle" type="button" title="Toggle interface names between OS (enP22...) and P2P/field labels (M1, S1)" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21,9L17,5V8H10V10H17V13M7,11L3,15L7,19V16H14V14H7V11Z"/></svg><span id="p2p-toggle-text">P2P: On</span></button>
            <button class="btn btn-primary" id="bmc-export" type="button" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>Download CSV</button>
        </div>
    </div>
    <div id="bmc-error" class="error" role="alert" hidden></div>
    <div class="dashboard-section">
        <div class="section-header"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>BMC Connection Summary</div>
        <div class="section-content"><div class="summary-grid" id="bmc-summary">
            <div class="summary-card card-total" role="button" tabindex="0" aria-pressed="false" data-status=""><div class="card-value" id="bmc-total">0</div><div class="card-label">Total Ports</div></div>
            <div class="summary-card card-excellent" role="button" tabindex="0" aria-pressed="false" data-status="MATCH"><div class="card-value" id="bmc-match">0</div><div class="card-label">Successful Ports</div></div>
            <div class="summary-card card-critical" role="button" tabindex="0" aria-pressed="false" data-status="__connection"><div class="card-value" id="bmc-problem">0</div><div class="card-label">Failed Ports</div></div>
            <div class="summary-card card-warning" role="button" tabindex="0" aria-pressed="false" data-status="NOT SEEN" title="A MAC that is not seen may have aged out; it does not confirm the BMC is offline."><div class="card-value" id="bmc-notSeen">0</div><div class="card-label">Warning Ports</div></div>
            <div class="summary-card card-info" role="button" tabindex="0" aria-pressed="false" data-status="__unknown"><div class="card-value" id="bmc-unknown">0</div><div class="card-label">No Information</div></div>
        </div></div>
    </div>
    <div class="dashboard-section">
        <div class="section-header"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4,1H20A1,1 0 0,1 21,2V6A1,1 0 0,1 20,7H4A1,1 0 0,1 3,6V2A1,1 0 0,1 4,1M4,9H20A1,1 0 0,1 21,10V14A1,1 0 0,1 20,15H4A1,1 0 0,1 3,14V10A1,1 0 0,1 4,9M4,17H20A1,1 0 0,1 21,18V22A1,1 0 0,1 20,23H4A1,1 0 0,1 3,22V18A1,1 0 0,1 4,17M9,5H10V3H9V5M9,13H10V11H9V13M9,21H10V19H9V21M5,3V5H7V3H5M5,11V13H7V11H5M5,19V21H7V19H5Z"/></svg>BMC Connection Status</div>
        <div class="section-content" style="padding:0;">
            <div id="filter-info" class="filter-info" role="status" aria-live="polite" aria-atomic="true" hidden><span id="filter-text"></span><button type="button" id="bmc-clear">Show All</button></div>
            <div class="loading" id="bmc-loading" role="status">Loading BMC observations…</div>
            <div class="table-scroll" id="bmc-table-wrap">
                <table class="bmc-results-table" id="bmc-table">
                    <thead><tr>
                        <th class="sortable" data-column="0" tabindex="0" scope="col">Switch <span class="sort-arrow"></span></th>
                        <th class="sortable" data-column="1" tabindex="0" scope="col">Port <span class="sort-arrow"></span></th>
                        <th class="sortable" data-column="2" tabindex="0" scope="col">Expected-MAC <span class="sort-arrow"></span></th>
                        <th class="sortable" data-column="3" tabindex="0" scope="col">Active-MAC <span class="sort-arrow"></span></th>
                        <th class="sortable" data-column="4" tabindex="0" scope="col">Hostname <span class="sort-arrow"></span></th>
                        <th class="sortable" data-column="5" tabindex="0" scope="col">Status <span class="sort-arrow"></span></th>
                    </tr></thead>
                    <tbody id="bmc-rows"></tbody>
                </table>
            </div>
            <div class="bmc-count" id="bmc-count" aria-live="polite"></div>
        </div>
    </div>
    <script src="/css/jquery-3.5.1.min.js"></script>
    <script src="/css/select2.min.js"></script>
    <script src="/css/bmc.js?v=20261021-3"></script>
    <script src="/css/bmc-results.js?v=20261021-3"></script>
    <script src="/css/table-filter.js?v=20260821-tf-6"></script>
    <script>document.addEventListener('DOMContentLoaded', function () { LLDPqBMCResults.initResults(LLDPqBMC); });</script>
</body>
</html>
